<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">O</span>
      <div class="brand-text">
        <span class="brand-name">{{ lang.t('company.brand') }}</span>
        <span class="brand-sub">{{ lang.t('company.subBrand') }}</span>
      </div>
    </div>

    <nav class="nav">
      <a routerLink="kb" routerLinkActive="active" class="nav-item">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>{{ lang.t('company.navKb') }}</span>
      </a>
      <a routerLink="users" routerLinkActive="active" class="nav-item">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>{{ lang.t('company.navUsers') }}</span>
      </a>
      <a routerLink="token-requests" routerLinkActive="active" class="nav-item">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v1H7a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-2V5a3 3 0 0 0-3-3z"/><path d="M9 12h6M9 16h6"/></svg>
        <span>{{ lang.t('company.navTokenRequests') }}</span>
      </a>
      <a routerLink="/chat" routerLinkActive="active" class="nav-item">
        <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>{{ lang.t('company.navChat') }}</span>
      </a>
    </nav>

    <app-language-switcher />

    <div class="sidebar-footer">
      <div class="who">
        <span class="avatar">{{ userEmail() | slice:0:1 | uppercase }}</span>
        <span class="email">{{ userEmail() }}</span>
      </div>
      <button class="signout" (click)="logout()" [attr.aria-label]="lang.t('toolbar.signOut')" [title]="lang.t('toolbar.signOut')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
