<header class="topbar">
  <div class="brand">
    <span class="brand-mark">O</span>
    <span>{{ lang.t('toolbar.brand') }}</span>
  </div>
  <div class="right">
    <app-language-switcher />

    @if (isSuperAdmin()) {
      <label class="model-select tenant-select">
        {{ lang.t('toolbar.company') }}
        <select name="company" [ngModel]="companyId()"
                (ngModelChange)="companyChange.emit($event)">
          @for (c of companies(); track c.id) {
            <option [ngValue]="c.id">{{ c.name }}</option>
          }
        </select>
      </label>
    }

    <label class="model-select">
      {{ lang.t('toolbar.model') }}
      <select name="provider" [(ngModel)]="providerId"
              (ngModelChange)="providerChange.emit()">
        @for (p of providerViews(); track p.id) {
          <option [ngValue]="p.id" [disabled]="!p.available">
            {{ p.display_name }}
          </option>
        }
      </select>
    </label>

    <label class="gen-control temp" [title]="lang.t('toolbar.tempHint')">
      <span class="temp-head">
        <span>{{ lang.t('toolbar.temp') }}</span>
        <span class="temp-value">{{ temperature().toFixed(1) }}</span>
      </span>
      <input class="slider" type="range" name="temperature" min="0" max="1" step="0.1"
             [style.--pct]="temperature() * 100 + '%'"
             [(ngModel)]="temperature" />
      <span class="temp-scale"><span>{{ lang.t('toolbar.focused') }}</span><span>{{ lang.t('toolbar.creative') }}</span></span>
    </label>
    <label class="gen-control" [title]="lang.t('toolbar.maxTokensHint')">
      {{ lang.t('toolbar.maxTokens') }}
      <input type="number" name="maxTokens" class="tokens" min="1"
             [max]="maxTokensCeiling()" [(ngModel)]="maxTokens" />
    </label>

    <span class="user">{{ userEmail() }}</span>
    <a class="link" routerLink="/requests">{{ lang.t('toolbar.tokenRequests') }}</a>
    @if (consoleHome(); as home) {
      <a class="link" [routerLink]="home">{{ lang.t('toolbar.backToConsole') }}</a>
    }
    <button class="link icon-link" (click)="logout.emit()" [title]="lang.t('toolbar.signOut')" [attr.aria-label]="lang.t('toolbar.signOut')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </div>
</header>
