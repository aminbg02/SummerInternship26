<form class="composer" (ngSubmit)="send.emit()">
  <label class="attach" [title]="lang.t('composer.attachHint')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05 12.25 20.24a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95l-9.2 9.19a1.5 1.5 0 0 1-2.12-2.12l8.49-8.48"/></svg>
    <input type="file" (change)="onFileSelected($event)" hidden />
  </label>
  <input class="input" name="draft" [(ngModel)]="draft"
         [placeholder]="lang.t('composer.placeholder')" autocomplete="off" />
  <button class="send" type="submit" [disabled]="!canSend()">
    <span>{{ lang.t('composer.send') }}</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
  </button>
</form>
